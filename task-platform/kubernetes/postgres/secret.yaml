# In real usage you would NOT commit this with a real password.
# For local dev with kind it's fine; in Phase 8 (cloud) this gets replaced
# by a secrets manager (e.g. External Secrets Operator + cloud KMS).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: taskapp
type: Opaque
stringData:
  POSTGRES_PASSWORD: "changeme-local-dev"
